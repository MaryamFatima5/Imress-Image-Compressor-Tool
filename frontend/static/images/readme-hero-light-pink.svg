<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Imress — private desktop image compression</title>
  <desc id="desc">A light-pink Imress hero banner with subtle camera, radial-ring, and optimization-arrow animations.</desc>

  <defs>
    <linearGradient id="imress-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDFE"/>
      <stop offset="1" stop-color="#FFF0F6"/>
    </linearGradient>
    <linearGradient id="imress-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF338F"/>
      <stop offset=".58" stop-color="#E6177D"/>
      <stop offset="1" stop-color="#B80A5D"/>
    </linearGradient>

    <!-- Reusable dotted ring -->
    <circle id="dotted-ring" cx="0" cy="0" r="116" fill="none" stroke="#E6177D" stroke-width="2" stroke-dasharray="3 13" opacity=".3"/>

    <!-- Reusable white pill badge -->
    <g id="badge-base">
      <rect width="178" height="46" rx="23" fill="#FFFFFF" stroke="#E6177D" stroke-opacity=".6"/>
    </g>
  </defs>

  <rect width="1200" height="600" rx="30" fill="url(#imress-bg)"/>
  <rect x="1" y="1" width="1198" height="598" rx="29" fill="none" stroke="#E6177D" stroke-opacity=".16"/>
  <path d="M0 475C190 426 322 552 524 494S888 389 1200 444V600H0Z" fill="#FF338F" opacity=".12"/>

  <!-- Animated dotted radial rings -->
  <g transform="translate(205 285)">
    <g>
      <use href="#dotted-ring"/>
      <use href="#dotted-ring" transform="scale(.76)"/>
      <use href="#dotted-ring" transform="scale(1.22)"/>
      <circle r="92" fill="none" stroke="#E6177D" stroke-width="2" opacity=".2"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Animated camera badge -->
  <g transform="translate(205 285)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>

      <circle r="78" fill="#FFF0F6" stroke="#E6177D" stroke-width="5"/>
      <path d="M-54 0h-19m146 0h19M0-54v-19M0 54v19" stroke="#FF338F" stroke-width="6" stroke-linecap="round"/>

      <rect x="-46" y="-34" width="92" height="68" rx="15" fill="url(#imress-pink)"/>
      <path d="M-24-46h48l10 12h-68l10-12Z" fill="#FF8ABD"/>
      <rect x="23" y="-22" width="11" height="8" rx="2" fill="#FFF0F6" opacity=".95"/>

      <circle r="27" fill="#FFFFFF"/>
      <circle r="21" fill="#181E29"/>
      <circle r="13" fill="#FFF0F6"/>
      <circle cx="5" cy="-5" r="4" fill="#FFFFFF"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="370" y="218" fill="#181E29" font-size="76" font-weight="800" letter-spacing="4">IMRESS</text>
    <text x="375" y="266" fill="#E6177D" font-size="19" font-weight="700" letter-spacing="4">DESKTOP IMAGE COMPRESSION</text>
    <text x="375" y="320" fill="#4E596D" font-size="27">Make images lighter. Keep your files private.</text>
  </g>

  <!-- Animated optimize arrow -->
  <g transform="translate(930 175)" fill="none" stroke="#E6177D" stroke-linecap="round">
    <text x="0" y="-20" fill="#B80A5D" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">OPTIMIZE</text>
    <path d="M0 18h178" stroke-width="4" stroke-dasharray="10 12">
      <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="m166 6 13 12-13 12" stroke-width="4"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
    <g transform="translate(375 382)">
      <use href="#badge-base"/>
      <rect x="17" y="15" width="16" height="16" rx="2" fill="#E6177D"/>
      <path d="M25 16v14m-7-7h14" stroke="#FFFFFF" stroke-width="2"/>
      <text x="47" y="29" fill="#B80A5D">BATCH READY</text>
    </g>

    <g transform="translate(570 382)">
      <use href="#badge-base"/>
      <path d="M18 29v-9a8 8 0 0 1 16 0v9m-18 0h20v11H16V29Z" fill="#E6177D"/>
      <text x="49" y="29" fill="#B80A5D">LOCAL ONLY</text>
    </g>

    <g transform="translate(765 382)">
      <use href="#badge-base"/>
      <path d="M18 15h8v8h-8zm11 0h8v8h-8zm-11 11h8v8h-8zm11 0h8v8h-8z" fill="#E6177D"/>
      <text x="50" y="29" fill="#B80A5D">WINDOWS x64</text>
    </g>
  </g>
</svg>
